<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" width="400" height="470">
  <defs>
    <radialGradient id="skin" cx="42%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#F9DCC2"/>
      <stop offset="100%" stop-color="#E2AE88"/>
    </radialGradient>
    <linearGradient id="hijab" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#F5CDD2"/>
      <stop offset="100%" stop-color="#DB93A0"/>
    </linearGradient>
    <linearGradient id="blazer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34488A"/>
      <stop offset="100%" stop-color="#23315F"/>
    </linearGradient>
    <style>
      .eye { transform-box: fill-box; transform-origin: center; animation: blink 5s infinite; }
      @keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(0.1); } }
      .spark { transform-box: fill-box; transform-origin: center; animation: twinkle 2.6s ease-in-out infinite; }
      .spark.late { animation-delay: 1.3s; }
      @keyframes twinkle { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(0.6); opacity: 0.5; } }
      .bob { animation: bob 3.2s ease-in-out infinite; }
      @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
      .dot { animation: think 1.4s ease-in-out infinite; }
      .dot.d2 { animation-delay: 0.2s; }
      .dot.d3 { animation-delay: 0.4s; }
      @keyframes think { 0%, 60%, 100% { transform: translateY(0); opacity: 0.45; } 30% { transform: translateY(-6px); opacity: 1; } }
    </style>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="188" cy="456" rx="112" ry="9" fill="#0F172A" opacity="0.10"/>

  <!-- stool: metal legs + foot ring + seat -->
  <path d="M142 352 L126 452 M228 352 L244 452 M166 356 L160 450 M204 356 L210 450" stroke="#9AA7B8" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="185" cy="416" rx="52" ry="7" fill="none" stroke="#9AA7B8" stroke-width="4"/>
  <path d="M110 348 L110 358 C110 366 144 372 185 372 C226 372 260 366 260 358 L260 348 Z" fill="#E2E8F0"/>
  <ellipse cx="185" cy="348" rx="75" ry="13" fill="#FFFFFF" stroke="#D5DEE8" stroke-width="1.5"/>

  <!-- legs (trousers) + shoes -->
  <rect x="140" y="350" width="28" height="92" rx="12" fill="#3B4252"/>
  <rect x="202" y="350" width="28" height="92" rx="12" fill="#3B4252"/>
  <rect x="132" y="316" width="106" height="52" rx="22" fill="#434B5C"/>
  <ellipse cx="150" cy="446" rx="21" ry="9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <ellipse cx="220" cy="446" rx="21" ry="9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- torso: blazer + white shirt -->
  <path d="M138 332 C134 290 142 262 185 252 C228 262 236 290 232 332 Z" fill="url(#blazer)"/>
  <path d="M170 256 L200 256 L185 302 Z" fill="#FFFFFF"/>
  <path d="M170 256 L162 300 M200 256 L208 300" stroke="#1B2549" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

  <!-- hijab (fitted around the face, short drape) -->
  <path d="M185 80
           C236 80 252 118 250 158
           C248 196 240 222 232 238
           C222 252 206 260 185 262
           C164 260 148 252 138 238
           C130 222 122 196 120 158
           C118 118 134 80 185 80 Z" fill="url(#hijab)"/>
  <ellipse cx="146" cy="116" rx="24" ry="12" transform="rotate(-38 146 116)" fill="#FFFFFF" opacity="0.3"/>
  <path d="M146 226 Q185 250 226 224" stroke="#C97D8B" stroke-width="3" fill="none" opacity="0.6" stroke-linecap="round"/>

  <!-- face frame (under-scarf) + face -->
  <ellipse cx="185" cy="156" rx="56" ry="62" fill="#F9E3E6"/>
  <ellipse cx="185" cy="160" rx="48" ry="54" fill="url(#skin)"/>

  <!-- cheeks -->
  <ellipse cx="157" cy="182" rx="9" ry="6" fill="#F59E96" opacity="0.6"/>
  <ellipse cx="213" cy="182" rx="9" ry="6" fill="#F59E96" opacity="0.6"/>

  <!-- eyebrows (right one raised = thinking) -->
  <path d="M152 137 Q163 131 174 135" stroke="#5B3A29" stroke-width="3.2" fill="none" stroke-linecap="round"/>
  <path d="M196 130 Q207 121 218 127" stroke="#5B3A29" stroke-width="3.2" fill="none" stroke-linecap="round"/>

  <!-- eyes looking up-right -->
  <g class="eye">
    <ellipse cx="165" cy="157" rx="8" ry="10" fill="#1F2937"/>
    <circle cx="168.5" cy="152" r="3.2" fill="#FFFFFF"/>
  </g>
  <g class="eye">
    <ellipse cx="206" cy="156" rx="8" ry="10" fill="#1F2937"/>
    <circle cx="209.5" cy="151" r="3.2" fill="#FFFFFF"/>
  </g>

  <!-- nose + thinking mouth ("hmm") -->
  <path d="M183 170 Q185 174 189 172" stroke="#D39276" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M175 190 Q185 194 195 187" stroke="#9A3B2F" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- left arm folded across the waist -->
  <path d="M146 270 C134 292 140 308 160 309 L212 307" stroke="#2A3A73" stroke-width="22" fill="none" stroke-linecap="round"/>
  <circle cx="216" cy="306" r="10" fill="url(#skin)"/>

  <!-- right arm: elbow on the left hand, hand on the chin -->
  <path d="M226 270 C242 288 240 304 230 308" stroke="#2A3A73" stroke-width="22" fill="none" stroke-linecap="round"/>
  <path d="M230 308 C224 272 212 238 206 214" stroke="#2A3A73" stroke-width="19" fill="none" stroke-linecap="round"/>
  <circle cx="204" cy="205" r="11" fill="url(#skin)"/>
  <ellipse cx="210" cy="192" rx="4" ry="9" transform="rotate(18 210 192)" fill="url(#skin)"/>

  <!-- thought bubble with "typing" dots -->
  <circle cx="246" cy="114" r="5" fill="#FFFFFF" stroke="#D6E6F5" stroke-width="1.5"/>
  <circle cx="261" cy="95" r="8" fill="#FFFFFF" stroke="#D6E6F5" stroke-width="1.5"/>
  <g class="bob">
    <rect x="262" y="30" width="96" height="48" rx="24" fill="#FFFFFF" stroke="#D6E6F5" stroke-width="1.5"/>
    <circle class="dot" cx="290" cy="54" r="6" fill="#2F80ED"/>
    <circle class="dot d2" cx="310" cy="54" r="6" fill="#2F80ED"/>
    <circle class="dot d3" cx="330" cy="54" r="6" fill="#2F80ED"/>
  </g>

  <!-- floating quiz card (top left) -->
  <g transform="translate(36 78) rotate(-8)">
    <g class="bob">
      <rect width="70" height="50" rx="11" fill="#FFFFFF" stroke="#D6E6F5" stroke-width="1.5"/>
      <circle cx="14" cy="16" r="4.5" fill="#2F80ED"/>
      <rect x="24" y="13" width="34" height="6" rx="3" fill="#BFD7F2"/>
      <circle cx="14" cy="34" r="4.5" fill="none" stroke="#CBD5E1" stroke-width="2"/>
      <rect x="24" y="31" width="26" height="6" rx="3" fill="#E2E8F0"/>
    </g>
  </g>

  <!-- sparkles -->
  <path class="spark" d="M318 150 L322 162 L334 166 L322 170 L318 182 L314 170 L302 166 L314 162 Z" fill="#FFC857"/>
  <path class="spark late" d="M70 190 L73 199 L82 202 L73 205 L70 214 L67 205 L58 202 L67 199 Z" fill="#7CC4FF"/>
</svg>
