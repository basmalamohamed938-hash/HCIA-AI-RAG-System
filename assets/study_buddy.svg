<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" width="400" height="470">
  <defs>
    <!-- light comes from the top-left → every part has a bright spot top-left and a darker edge -->
    <radialGradient id="skin" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#FFE7D4"/>
      <stop offset="60%" stop-color="#F2C2A0"/>
      <stop offset="100%" stop-color="#D9996F"/>
    </radialGradient>
    <radialGradient id="hijab" cx="32%" cy="25%" r="85%">
      <stop offset="0%" stop-color="#FBE0E4"/>
      <stop offset="55%" stop-color="#E7A7B2"/>
      <stop offset="100%" stop-color="#C47584"/>
    </radialGradient>
    <radialGradient id="hijabDark" cx="40%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#E9AEB8"/>
      <stop offset="100%" stop-color="#B56675"/>
    </radialGradient>
    <radialGradient id="blazer" cx="30%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#5068B4"/>
      <stop offset="55%" stop-color="#2E4082"/>
      <stop offset="100%" stop-color="#1B2654"/>
    </radialGradient>
    <linearGradient id="sleeve" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#465EA8"/>
      <stop offset="100%" stop-color="#22306A"/>
    </linearGradient>
    <linearGradient id="pants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5A6275"/>
      <stop offset="100%" stop-color="#343A48"/>
    </linearGradient>
    <linearGradient id="pantsBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#474E5F"/>
      <stop offset="100%" stop-color="#2A2F3A"/>
    </linearGradient>
    <radialGradient id="shoe" cx="35%" cy="25%" r="85%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CBD3DE"/>
    </radialGradient>
    <radialGradient id="seat" cx="40%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D5DCE6"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C5CEDA"/>
      <stop offset="50%" stop-color="#8C98AA"/>
      <stop offset="100%" stop-color="#B7C1CF"/>
    </linearGradient>
    <radialGradient id="iris" cx="50%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#6B4A2E"/>
      <stop offset="100%" stop-color="#1C1512"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <style>
      .eye { transform-box: fill-box; transform-origin: center; animation: blink 5s infinite; }
      @keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(0.1); } }
      .spark { transform-box: fill-box; transform-origin: center; animation: twinkle 2.6s ease-in-out infinite; }
      .spark.late { animation-delay: 1.3s; }
      @keyframes twinkle { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(0.6); opacity: 0.5; } }
      .bob { animation: bob 3.2s ease-in-out infinite; }
      @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
      .dot { animation: think 1.4s ease-in-out infinite; }
      .dot.d2 { animation-delay: 0.2s; }
      .dot.d3 { animation-delay: 0.4s; }
      @keyframes think { 0%, 60%, 100% { transform: translateY(0); opacity: 0.45; } 30% { transform: translateY(-6px); opacity: 1; } }
    </style>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="200" cy="455" rx="120" ry="10" fill="#0F172A" opacity="0.12" filter="url(#soft)"/>

  <!-- ===== stool ===== -->
  <path d="M128 360 L114 452" stroke="url(#metal)" stroke-width="7" stroke-linecap="round"/>
  <path d="M158 364 L154 450" stroke="url(#metal)" stroke-width="7" stroke-linecap="round"/>
  <path d="M196 364 L202 450" stroke="url(#metal)" stroke-width="7" stroke-linecap="round"/>
  <path d="M226 360 L240 452" stroke="url(#metal)" stroke-width="7" stroke-linecap="round"/>
  <ellipse cx="177" cy="416" rx="54" ry="8" fill="none" stroke="#9AA6B8" stroke-width="5"/>
  <path d="M112 350 L112 362 C112 372 142 378 177 378 C212 378 242 372 242 362 L242 350 Z" fill="#CBD3DE"/>
  <ellipse cx="177" cy="350" rx="65" ry="14" fill="url(#seat)"/>

  <!-- ===== back leg (further from us, darker) ===== -->
  <path d="M170 332 L236 336 C250 337 252 356 238 358 L170 360 Z" fill="url(#pantsBack)"/>
  <rect x="214" y="342" width="24" height="92" rx="11" fill="url(#pantsBack)"/>
  <path d="M208 434 C208 426 226 424 240 428 L262 436 C272 440 270 452 258 452 L214 452 C206 452 204 442 208 434 Z" fill="#DCE2EA"/>

  <!-- ===== torso (3/4 view, leaning forward) ===== -->
  <path d="M146 258 C164 242 214 238 234 254 C248 276 240 312 214 342 L150 346 C136 318 134 282 146 258 Z" fill="url(#blazer)"/>
  <!-- white shirt collar peeking out -->
  <path d="M196 250 L222 252 L210 280 Z" fill="#F4F7FB"/>
  <!-- blazer lapel + soft shadow under the head -->
  <path d="M196 252 L188 300" stroke="#16204A" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>
  <ellipse cx="196" cy="262" rx="44" ry="12" fill="#0F172A" opacity="0.25" filter="url(#soft)"/>

  <!-- back arm resting on the lap -->
  <path d="M152 266 C140 294 146 320 170 330 L196 334" stroke="url(#sleeve)" stroke-width="21" fill="none" stroke-linecap="round"/>
  <ellipse cx="202" cy="334" rx="11" ry="9" fill="url(#skin)"/>

  <!-- ===== front leg (closer to us) ===== -->
  <path d="M158 322 L250 326 C268 327 270 354 252 356 L158 358 C146 356 146 324 158 322 Z" fill="url(#pants)"/>
  <rect x="238" y="340" width="27" height="96" rx="12" fill="url(#pants)"/>
  <path d="M232 438 C232 428 252 426 268 430 L292 438 C304 442 302 456 288 456 L240 456 C230 456 228 446 232 438 Z" fill="url(#shoe)"/>
  <path d="M234 450 L296 450" stroke="#AEB8C6" stroke-width="3" stroke-linecap="round"/>

  <!-- ===== head ===== -->
  <!-- modern wrap: small bun volume at the back of the head -->
  <ellipse cx="160" cy="128" rx="30" ry="26" fill="url(#hijabDark)"/>
  <!-- fitted wrap around the head and neck (short, stops at the shoulders) -->
  <path d="M208 92
           C252 90 272 124 268 164
           C266 198 256 220 242 234
           C230 246 212 252 196 252
           C180 262 160 262 148 252
           C138 238 142 220 150 208
           C140 190 138 162 146 138
           C156 108 180 92 208 92 Z" fill="url(#hijab)"/>
  <!-- wrap folds -->
  <path d="M150 150 C170 118 206 104 240 108" stroke="#FFFFFF" stroke-width="5" fill="none" opacity="0.35" stroke-linecap="round"/>
  <path d="M156 232 C176 246 206 246 232 236" stroke="#C47584" stroke-width="3" fill="none" opacity="0.6" stroke-linecap="round"/>

  <!-- face (3/4 view: turned a little to the right) -->
  <ellipse cx="216" cy="166" rx="47" ry="54" fill="#F7E1E4"/>
  <ellipse cx="218" cy="168" rx="41" ry="48" fill="url(#skin)"/>
  <!-- soft shading on the far cheek -->
  <ellipse cx="248" cy="178" rx="12" ry="26" fill="#C98460" opacity="0.18" filter="url(#soft)"/>

  <!-- cheeks -->
  <ellipse cx="199" cy="190" rx="9" ry="6" fill="#F4978D" opacity="0.55"/>
  <ellipse cx="246" cy="188" rx="6" ry="5" fill="#F4978D" opacity="0.5"/>

  <!-- eyebrows (far one raised = thinking) -->
  <path d="M190 144 Q201 138 212 142" stroke="#5B3A29" stroke-width="3.2" fill="none" stroke-linecap="round"/>
  <path d="M228 136 Q238 129 248 134" stroke="#5B3A29" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- eyes looking up-right (glossy, toy-like) -->
  <g class="eye">
    <ellipse cx="203" cy="164" rx="8.5" ry="10.5" fill="url(#iris)"/>
    <circle cx="206.5" cy="159" r="3.4" fill="#FFFFFF"/>
    <circle cx="200.5" cy="169" r="1.4" fill="#FFFFFF" opacity="0.8"/>
  </g>
  <g class="eye">
    <ellipse cx="238" cy="162" rx="7" ry="9.5" fill="url(#iris)"/>
    <circle cx="241" cy="157.5" r="3" fill="#FFFFFF"/>
  </g>

  <!-- nose (pointing right) + "hmm" mouth -->
  <path d="M226 176 Q231 182 225 185" stroke="#C98763" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <ellipse cx="227" cy="176" rx="2" ry="1.4" fill="#FFFFFF" opacity="0.55"/>
  <path d="M211 202 Q222 205 232 199" stroke="#99433A" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- ===== front arm: elbow on the knee, hand under the chin ===== -->
  <path d="M228 262 C246 280 254 304 252 322" stroke="url(#sleeve)" stroke-width="23" fill="none" stroke-linecap="round"/>
  <path d="M252 324 C250 290 244 254 236 228" stroke="url(#sleeve)" stroke-width="20" fill="none" stroke-linecap="round"/>
  <ellipse cx="234" cy="219" rx="12" ry="11" fill="url(#skin)"/>
  <ellipse cx="243" cy="204" rx="4" ry="10" transform="rotate(14 243 204)" fill="url(#skin)"/>

  <!-- ===== thought bubble with "typing" dots ===== -->
  <circle cx="270" cy="118" r="5" fill="#FFFFFF" stroke="#D6E6F5" stroke-width="1.5"/>
  <circle cx="284" cy="98" r="8" fill="#FFFFFF" stroke="#D6E6F5" stroke-width="1.5"/>
  <g class="bob">
    <rect x="276" y="32" width="96" height="48" rx="24" fill="#FFFFFF" stroke="#D6E6F5" stroke-width="1.5"/>
    <circle class="dot" cx="304" cy="56" r="6" fill="#2F80ED"/>
    <circle class="dot d2" cx="324" cy="56" r="6" fill="#2F80ED"/>
    <circle class="dot d3" cx="344" cy="56" r="6" fill="#2F80ED"/>
  </g>

  <!-- floating quiz card (top left) -->
  <g transform="translate(36 78) rotate(-8)">
    <g class="bob">
      <rect width="70" height="50" rx="11" fill="#FFFFFF" stroke="#D6E6F5" stroke-width="1.5"/>
      <circle cx="14" cy="16" r="4.5" fill="#2F80ED"/>
      <rect x="24" y="13" width="34" height="6" rx="3" fill="#BFD7F2"/>
      <circle cx="14" cy="34" r="4.5" fill="none" stroke="#CBD5E1" stroke-width="2"/>
      <rect x="24" y="31" width="26" height="6" rx="3" fill="#E2E8F0"/>
    </g>
  </g>

  <!-- sparkles -->
  <path class="spark" d="M330 160 L334 172 L346 176 L334 180 L330 192 L326 180 L314 176 L326 172 Z" fill="#FFC857"/>
  <path class="spark late" d="M70 200 L73 209 L82 212 L73 215 L70 224 L67 215 L58 212 L67 209 Z" fill="#7CC4FF"/>
</svg>
